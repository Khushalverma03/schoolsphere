name: Build SchoolSphere Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project ZIP
        run: |
          unzip -o SchoolSphere_Android_Source.zip -d extracted

      - name: Locate Flutter project
        id: locate
        shell: bash
        run: |
          PROJECT_FILE=$(find extracted -name pubspec.yaml -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: pubspec.yaml not found."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Flutter project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Prepare Android project
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          if [ ! -f android/gradlew ]; then
            flutter create . --platforms=android
          fi

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: schoolsphere-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
